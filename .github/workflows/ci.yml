name: Portfolio CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: portfolio-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      APP_BASE_URL: http://localhost:18081/
      DATA_DIR: /tmp/portfolio-ci-data
      DB_PASSWORD: ci-only-password
      DB_ROOT_PASSWORD: ci-only-root-password
      ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      RELEASE_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose and shell scripts
        run: |
          docker compose config --quiet
          bash -n deploy/deploy.sh
          bash -n deploy/poll.sh
          sh -n docker/entrypoint.sh
      - name: Build production image
        run: |
          docker network create web-proxy
          docker compose build app
      - name: Validate Composer and PHP syntax
        run: |
          docker compose run --rm --no-deps app composer validate --no-check-publish
          docker compose run --rm --no-deps app sh -c 'find app public -name "*.php" -print0 | xargs -0 -n1 php -l >/dev/null'
      - name: Migrate clean database and seed portfolio
        run: |
          docker compose up -d --wait db
          docker compose run --rm app php spark migrate --all
          docker compose run --rm app php spark db:seed PortfolioContentSeeder
          docker compose up -d --wait --wait-timeout 120 app
      - name: Smoke test public pages and admin protection
        run: |
          for path in / /admin/login /blog /docs /gallery; do
            curl --fail --silent --show-error "http://127.0.0.1:18081$path" -o /dev/null
          done
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:18081/admin)" = 302
      - name: Diagnostics
        if: failure()
        run: docker compose logs --tail=100
      - name: Stop CI containers
        if: always()
        run: docker compose down --volumes
