name: portfolio

services:
  app:
    image: portfolio-app:${RELEASE_SHA:-local}
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:${APP_PORT:-18081}:80"
    environment:
      CI_ENVIRONMENT: production
      # CodeIgniter supports underscores; /bin/sh removes names containing dots.
      app_baseURL: ${APP_BASE_URL:-https://azrilachdi.web.id/}
      app_indexPage: ""
      database_default_hostname: db
      database_default_port: "3306"
      database_default_database: portfolio
      database_default_username: portfolio
      database_default_password: ${DB_PASSWORD:?Set DB_PASSWORD in the server environment file}
      database_default_DBDriver: MySQLi
      database_default_DBDebug: "false"
      encryption_key: ${ENCRYPTION_KEY:?Set ENCRYPTION_KEY in the server environment file}
    volumes:
      - ${DATA_DIR:-./data}/writable:/var/www/html/writable
      - ${DATA_DIR:-./data}/uploads:/var/www/html/public/uploads
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--max-time", "10", "http://127.0.0.1/"]
      interval: 20s
      timeout: 12s
      retries: 5
      start_period: 30s
    networks:
      backend:
      proxy:
        aliases:
          - portfolio-web

  db:
    image: mariadb:11.4
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: portfolio
      MARIADB_USER: portfolio
      MARIADB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in the server environment file}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Set DB_ROOT_PASSWORD in the server environment file}
    volumes:
      - ${DATA_DIR:-./data}/mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      - backend

networks:
  backend:
    internal: true
  proxy:
    external: true
    name: ${PROXY_NETWORK:-web-proxy}
