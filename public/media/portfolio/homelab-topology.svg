<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1500" viewBox="0 0 1600 1500" role="img" aria-labelledby="title desc"><title id="title">Topologi Home Lab Muhammad Azril Achdi</title><desc id="desc">ONT ke MikroTik; trunk ether4 ke GE1 Cisco SF200-24; tiga VLAN; Proxmox, Debian, Technitium; akses Azure WireGuard dan Tailscale dengan batas verifikasi.</desc><rect width="100%" height="100%" fill="#fcfcfc"/><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8Z" fill="#a8823f"/></marker></defs><g font-family="Arial, sans-serif"><text x="60" y="55" font-size="16" fill="#a8823f" font-weight="700">MUHAMMAD AZRIL ACHDI / HOME LAB</text><text x="60" y="103" font-size="36" fill="#191b20" font-weight="700">Jaringan, server, dan jalur akses</text><text x="60" y="137" font-size="18" fill="#646b75" font-weight="400">Konfigurasi pribadi • dicocokkan pada 16 Oktober 2026</text><path d="M 800 285 V 330" fill="none" stroke="#a8823f" stroke-width="2.5" marker-end="url(#arrow)" stroke-dasharray="8 7"/><path d="M 1010 410 H 1120 V 270 H 1160" fill="none" stroke="#a8823f" stroke-width="2.5" marker-end="url(#arrow)" stroke-dasharray="8 7"/><path d="M 800 500 V 590" fill="none" stroke="#a8823f" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M 800 725 V 765 H 285 V 815" fill="none" stroke="#a8823f" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M 800 725 V 815" fill="none" stroke="#a8823f" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M 800 765 H 1315 V 815" fill="none" stroke="#a8823f" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M 800 945 V 1005" fill="none" stroke="#a8823f" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M 285 945 V 1005" fill="none" stroke="#a8823f" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M 1315 945 V 1005" fill="none" stroke="#a8823f" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="610" y="185" width="380" height="100" rx="12" fill="#fff" stroke="#cbd0d6" stroke-width="1.5"/><text x="632" y="219" font-size="22" fill="#191b20" font-weight="700">ONT / Upstream ISP</text><text x="632" y="250" font-size="17" fill="#646b75" font-weight="400">LAN → ether1 MikroTik (sketsa)</text><rect x="1160" y="185" width="380" height="150" rx="12" fill="#faf6ec" stroke="#a8823f" stroke-width="1.5"/><text x="1182" y="219" font-size="22" fill="#191b20" font-weight="700">Azure VPS</text><text x="1182" y="250" font-size="17" fill="#646b75" font-weight="400">20.194.8.143:51820 (backup)</text><text x="1182" y="276" font-size="17" fill="#646b75" font-weight="400">Peer dirujuk: 10.10.0.1</text><text x="1182" y="302" font-size="17" fill="#646b75" font-weight="400">Nginx HTTPS → WireGuard</text><rect x="550" y="330" width="500" height="170" rx="12" fill="#faf6ec" stroke="#a8823f" stroke-width="1.5"/><text x="572" y="364" font-size="22" fill="#191b20" font-weight="700">MikroTik — gateway VLAN</text><text x="572" y="395" font-size="17" fill="#646b75" font-weight="400">10: 192.168.10.1 / 20: 192.168.20.1</text><text x="572" y="421" font-size="17" fill="#646b75" font-weight="400">30: 192.168.30.1</text><text x="572" y="447" font-size="17" fill="#646b75" font-weight="400">wg-azure: 10.10.0.2/24</text><text x="825" y="547" font-size="18" fill="#a8823f" font-weight="700">ether4 → GE1</text><text x="825" y="575" font-size="17" fill="#646b75" font-weight="400">802.1Q: VLAN 10 / 20 / 30 tagged</text><rect x="550" y="590" width="500" height="135" rx="12" fill="#faf6ec" stroke="#a8823f" stroke-width="1.5"/><text x="572" y="624" font-size="22" fill="#191b20" font-weight="700">Cisco SF200-24</text><text x="572" y="655" font-size="17" fill="#646b75" font-weight="400">GE1 trunk: 1UP, 10T, 20T, 30T</text><text x="572" y="681" font-size="17" fill="#646b75" font-weight="400">Native VLAN / PVID: 1</text><text x="105" y="791" font-size="17" fill="#a8823f" font-weight="700">FE1 / FE2 • access VLAN 10</text><text x="640" y="791" font-size="17" fill="#a8823f" font-weight="700">GE2 • access VLAN 20</text><text x="1140" y="791" font-size="17" fill="#a8823f" font-weight="700">FE3 • access VLAN 30</text><rect x="60" y="815" width="450" height="130" rx="12" fill="#fff" stroke="#cbd0d6" stroke-width="1.5"/><text x="82" y="849" font-size="22" fill="#191b20" font-weight="700">VLAN 10 — Management</text><text x="82" y="880" font-size="17" fill="#646b75" font-weight="400">192.168.10.0/24 • gateway .1</text><text x="82" y="906" font-size="17" fill="#646b75" font-weight="400">Pool DHCP: 192.168.10.100–200</text><rect x="575" y="815" width="450" height="130" rx="12" fill="#fff" stroke="#cbd0d6" stroke-width="1.5"/><text x="597" y="849" font-size="22" fill="#191b20" font-weight="700">VLAN 20 — Server</text><text x="597" y="880" font-size="17" fill="#646b75" font-weight="400">192.168.20.0/24 • gateway .1</text><text x="597" y="906" font-size="17" fill="#646b75" font-weight="400">Pool DHCP: 192.168.20.100–200</text><rect x="1090" y="815" width="450" height="130" rx="12" fill="#fff" stroke="#cbd0d6" stroke-width="1.5"/><text x="1112" y="849" font-size="22" fill="#191b20" font-weight="700">VLAN 30 — Client / guest</text><text x="1112" y="880" font-size="17" fill="#646b75" font-weight="400">192.168.30.0/24 • gateway .1</text><text x="1112" y="906" font-size="17" fill="#646b75" font-weight="400">Pool DHCP: 192.168.30.100–200</text><rect x="60" y="1005" width="450" height="145" rx="12" fill="#fff" stroke="#cbd0d6" stroke-width="1.5"/><text x="82" y="1039" font-size="22" fill="#191b20" font-weight="700">PC management</text><text x="82" y="1070" font-size="17" fill="#646b75" font-weight="400">Akses perangkat sesuai kebijakan router</text><text x="82" y="1096" font-size="17" fill="#646b75" font-weight="400">Cisco dirujuk backup: 192.168.10.2</text><text x="82" y="1122" font-size="17" fill="#646b75" font-weight="400">Alamat PC tidak ditetapkan di diagram</text><rect x="1090" y="1005" width="450" height="145" rx="12" fill="#fff" stroke="#cbd0d6" stroke-width="1.5"/><text x="1112" y="1039" font-size="22" fill="#191b20" font-weight="700">Access Point TP-Link</text><text x="1112" y="1070" font-size="17" fill="#646b75" font-weight="400">Cabang AP mengikuti sketsa pengguna</text><text x="1112" y="1096" font-size="17" fill="#646b75" font-weight="400">Client / guest pada segmen VLAN 30</text><text x="1112" y="1122" font-size="17" fill="#646b75" font-weight="400">Model dan IP AP belum diverifikasi</text><rect x="550" y="985" width="500" height="330" rx="16" fill="#faf6ec" stroke="#a8823f" stroke-width="1.5"/><text x="575" y="1020" font-size="21" fill="#191b20" font-weight="700">Proxmox VE • 192.168.20.200:8006</text><text x="575" y="1049" font-size="16" fill="#646b75" font-weight="400">Cabang virtualisasi mengikuti sketsa pribadi</text><rect x="575" y="1070" width="450" height="92" rx="12" fill="#fff" stroke="#cbd0d6" stroke-width="1.5"/><text x="597" y="1104" font-size="22" fill="#191b20" font-weight="700">Technitium DNS</text><text x="597" y="1135" font-size="17" fill="#646b75" font-weight="400">192.168.20.199 • DNS :53 / panel :5380</text><rect x="575" y="1180" width="450" height="110" rx="12" fill="#fff" stroke="#cbd0d6" stroke-width="1.5"/><text x="597" y="1214" font-size="22" fill="#191b20" font-weight="700">Debian Web Server</text><text x="597" y="1245" font-size="17" fill="#646b75" font-weight="400">192.168.20.195/24 • ens18 • DHCP</text><text x="597" y="1271" font-size="17" fill="#646b75" font-weight="400">Docker + Nginx Proxy Manager</text><rect x="60" y="1190" width="450" height="125" rx="12" fill="#fff" stroke="#cbd0d6" stroke-width="1.5"/><text x="82" y="1224" font-size="22" fill="#191b20" font-weight="700">Tailscale — akses pribadi</text><text x="82" y="1255" font-size="17" fill="#646b75" font-weight="400">Node, ACL, dan subnet route belum diperiksa</text><text x="82" y="1281" font-size="17" fill="#646b75" font-weight="400">tailscaled tidak aktif di Debian saat audit</text><text x="60" y="1370" font-size="15" fill="#a8823f" font-weight="700">MEMBACA DIAGRAM</text><text x="60" y="1400" font-size="17" fill="#646b75" font-weight="400">Garis utuh: pemetaan VLAN/perangkat yang dicocokkan. Garis putus: jalur logis atau hubungan dari sketsa/dokumentasi.</text><text x="60" y="1430" font-size="16" fill="#646b75" font-weight="400">Sumber: sketsa pribadi, screenshot Cisco, backup MikroTik, SSH Debian, endpoint Proxmox/Technitium, dan dokumentasi deployment.</text><text x="60" y="1460" font-size="16" fill="#646b75" font-weight="400">VM ID, bridge Proxmox, model AP, node Tailscale, serta status firewall aktif tidak diasumsikan. Kunci VPN dan backup asli tidak dipublikasikan.</text></g></svg>