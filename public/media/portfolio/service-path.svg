<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="930" viewBox="0 0 1600 930" role="img" aria-labelledby="title desc"><title id="title">Jalur akses website portofolio</title><desc id="desc">Internet HTTPS ke Azure Nginx, WireGuard ke MikroTik, Debian Nginx Proxy Manager, container CodeIgniter dan MariaDB. DNS lokal Technitium terpisah dari jalur HTTP.</desc><rect width="100%" height="100%" fill="#fcfcfc"/><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8Z" fill="#a8823f"/></marker></defs><g font-family="Arial, sans-serif"><text x="60" y="55" font-size="16" fill="#a8823f" font-weight="700">MUHAMMAD AZRIL ACHDI / SERVICE PATH</text><text x="60" y="103" font-size="36" fill="#191b20" font-weight="700">Dari domain publik ke aplikasi lokal</text><text x="60" y="140" font-size="18" fill="#646b75" font-weight="400">azrilachdi.web.id • alur deployment yang digunakan portofolio</text><path d="M 405 270 H 560" fill="none" stroke="#a8823f" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M 1040 270 H 1170" fill="none" stroke="#a8823f" stroke-width="2.5" marker-end="url(#arrow)" stroke-dasharray="8 7"/><path d="M 1345 345 V 410 H 800 V 470" fill="none" stroke="#a8823f" stroke-width="2.5" marker-end="url(#arrow)" stroke-dasharray="8 7"/><path d="M 1040 555 H 1160" fill="none" stroke="#a8823f" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M 1345 650 V 720" fill="none" stroke="#a8823f" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M 340 555 H 560" fill="none" stroke="#a8823f" stroke-width="2.5" marker-end="url(#arrow)" stroke-dasharray="8 7"/><rect x="60" y="210" width="345" height="120" rx="12" fill="#fff" stroke="#cbd0d6" stroke-width="1.5"/><text x="82" y="244" font-size="22" fill="#191b20" font-weight="700">Pengunjung website</text><text x="82" y="275" font-size="17" fill="#646b75" font-weight="400">azrilachdi.web.id</text><text x="82" y="301" font-size="17" fill="#646b75" font-weight="400">HTTPS :443</text><rect x="560" y="195" width="480" height="150" rx="12" fill="#faf6ec" stroke="#a8823f" stroke-width="1.5"/><text x="582" y="229" font-size="22" fill="#191b20" font-weight="700">Nginx pada Azure VPS</text><text x="582" y="260" font-size="17" fill="#646b75" font-weight="400">DNS publik: 20.194.8.143</text><text x="582" y="286" font-size="17" fill="#646b75" font-weight="400">Terminasi TLS (dokumen deployment)</text><text x="582" y="312" font-size="17" fill="#646b75" font-weight="400">Host + X-Forwarded-Proto: https</text><rect x="1170" y="195" width="370" height="150" rx="12" fill="#faf6ec" stroke="#a8823f" stroke-width="1.5"/><text x="1192" y="229" font-size="22" fill="#191b20" font-weight="700">MikroTik / WireGuard</text><text x="1192" y="260" font-size="17" fill="#646b75" font-weight="400">wg-azure: 10.10.0.2/24</text><text x="1192" y="286" font-size="17" fill="#646b75" font-weight="400">Peer VPS: 10.10.0.1</text><text x="1192" y="312" font-size="17" fill="#646b75" font-weight="400">Endpoint backup UDP :51820</text><text x="1065" y="248" font-size="17" fill="#a8823f" font-weight="700">tunnel</text><rect x="60" y="470" width="280" height="180" rx="12" fill="#fff" stroke="#cbd0d6" stroke-width="1.5"/><text x="82" y="504" font-size="22" fill="#191b20" font-weight="700">Technitium DNS</text><text x="82" y="535" font-size="17" fill="#646b75" font-weight="400">192.168.20.199:53</text><text x="82" y="561" font-size="17" fill="#646b75" font-weight="400">Resolver Debian via DHCP</text><text x="82" y="587" font-size="17" fill="#646b75" font-weight="400">Panel lokal :5380</text><text x="82" y="613" font-size="17" fill="#646b75" font-weight="400">Terpisah dari jalur HTTP</text><rect x="560" y="470" width="480" height="180" rx="12" fill="#faf6ec" stroke="#a8823f" stroke-width="1.5"/><text x="582" y="504" font-size="22" fill="#191b20" font-weight="700">Debian + Nginx Proxy Manager</text><text x="582" y="535" font-size="17" fill="#646b75" font-weight="400">Debian: 192.168.20.195</text><text x="582" y="561" font-size="17" fill="#646b75" font-weight="400">NPM host :80 / :81 / :443</text><text x="582" y="587" font-size="17" fill="#646b75" font-weight="400">Proxy host → portfolio-web:80</text><text x="582" y="613" font-size="17" fill="#646b75" font-weight="400">Network: web-proxy</text><rect x="1160" y="470" width="380" height="180" rx="12" fill="#fff" stroke="#cbd0d6" stroke-width="1.5"/><text x="1182" y="504" font-size="22" fill="#191b20" font-weight="700">Container portofolio</text><text x="1182" y="535" font-size="17" fill="#646b75" font-weight="400">CodeIgniter 4 • PHP 8.3 • Apache</text><text x="1182" y="561" font-size="17" fill="#646b75" font-weight="400">Origin host: 127.0.0.1:18081</text><text x="1182" y="587" font-size="17" fill="#646b75" font-weight="400">Volume unggahan &amp; writable</text><rect x="1160" y="720" width="380" height="115" rx="12" fill="#fff" stroke="#cbd0d6" stroke-width="1.5"/><text x="1182" y="754" font-size="22" fill="#191b20" font-weight="700">MariaDB 11.4</text><text x="1182" y="785" font-size="17" fill="#646b75" font-weight="400">Network backend internal</text><text x="1182" y="811" font-size="17" fill="#646b75" font-weight="400">Tanpa port database pada host</text><rect x="60" y="720" width="980" height="115" rx="12" fill="#fff" stroke="#cbd0d6" stroke-width="1.5"/><text x="82" y="754" font-size="22" fill="#191b20" font-weight="700">Akses administrasi pribadi</text><text x="82" y="785" font-size="17" fill="#646b75" font-weight="400">Tailscale digunakan sesuai informasi pengguna; node/ACL/rute belum diperiksa.</text><text x="82" y="811" font-size="17" fill="#646b75" font-weight="400">SSH Debian tersedia di jaringan lokal pada 192.168.20.195:22.</text><text x="60" y="887" font-size="17" fill="#646b75" font-weight="400">Sumber: backup MikroTik, DNS yang diamati, dokumentasi deploy, Compose, proxy host aktif, dan pemeriksaan SSH Debian.</text></g></svg>